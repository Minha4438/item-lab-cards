name: howabouthis-ig-publish
# 이거 어때?(@how.abouthis) 인스타 예약 게시: tools/howabouthis/queue/의 예약 중 시간이 된 1개를 올리고 결과를 커밋 (Claude 사용량 없음)
# 예약은 로컬에서 ig_queue.py add 로 만든다. 필요: Secret HOWABOUTHIS_IG_TOKEN (@how.abouthis 인스타 로그인 토큰)
on:
  schedule:
    - cron: "2,32 * * * *"   # 30분마다 (정각을 피함, 다른 스레드 액션 :07/:12/:22/:37/:42/:52 와 겹치지 않게)
  workflow_dispatch:
concurrency:
  group: howabouthis-ig-publish
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 예약 게시
        env:
          INSTAGRAM_ACCESS_TOKEN_HOWABOUTHIS: ${{ secrets.HOWABOUTHIS_IG_TOKEN }}  # @how.abouthis 인스타 토큰
        run: python tools/howabouthis/ig_queue.py run --live
      - name: 결과 기록 커밋
        if: always()
        run: |
          git config user.name "howabouthis-ig-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/howabouthis/queue tools/howabouthis/history.json
          git diff --cached --quiet || (git commit -m "howabouthis-ig-publish: 게시 결과 기록" && git pull --rebase origin main && git push)
