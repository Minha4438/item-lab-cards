name: threads-publish
# 아이템연구소 스레드 예약 게시 (Claude 사용량 없음). 2026-10-12 교체: 예약 파일이 push 되면 시작해서 정해진 시각까지 기다렸다가 그 시각에 올린다.
# GitHub 예약(cron)이 5시간 안팎으로만 돌아 시간이 밀려서 만든 방식. cron은 예비 감시용으로 남겨 둔다 (cron 줄은 바꾸지 않음)
on:
  schedule:
    - cron: "11,41 * * * *"   # 30분마다 (정각을 피함). GitHub 예약은 몇 분~수십 분 늦을 수 있음
  push:
    paths:
      - "tools/threads/queue/**"
  workflow_dispatch:
concurrency:
  group: threads-publish
  cancel-in-progress: false
permissions:
  contents: write
  actions: write   # 다음 실행을 스스로 예약하려고
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 예약 게시 (시각까지 기다렸다가 게시)
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.ITEMLAB_THREADS_TOKEN }}  # @item.lab.kr 토큰
          GH_TOKEN: ${{ github.token }}
        run: python tools/threads/publish_wait.py
      - name: 결과 기록 커밋
        if: always()
        run: |
          git config user.name "threads-publish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/threads/queue tools/threads/no_map.json
          git diff --cached --quiet || (git commit -m "threads-publish: 게시 결과 기록" && git pull --rebase origin main && git push)
