name: threads-publish
# 아이템연구소 스레드 예약 게시: tools/threads/queue/의 예약 중 시간이 된 1개를 올리고 결과를 커밋 (Claude 사용량 없음)
on:
  schedule:
    - cron: "11,41 * * * *"   # 30분마다 (정각을 피함). GitHub 예약은 몇 분~수십 분 늦을 수 있음
  workflow_dispatch:
concurrency:
  group: threads-publish
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 예약 게시
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.ITEMLAB_THREADS_TOKEN }}  # @item.lab.kr 토큰
        run: python tools/threads/publish_queue.py --live
      - name: 결과 기록 커밋
        if: always()
        run: |
          git config user.name "threads-publish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/threads/queue tools/threads/no_map.json
          git diff --cached --quiet || (git commit -m "threads-publish: 게시 결과 기록" && git pull --rebase origin main && git push)
